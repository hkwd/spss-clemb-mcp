[project]
name = "spss-clemb-mcp"
version = "0.1.0"
description = "MCP server for executing SPSS Modeler clemb.exe"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=0.9.0",
]

[project.scripts]
spss-clemb-mcp = "spss_clemb_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spss_clemb_mcp"]